<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <script src="script.js"></script>
</head>
<body>
<div class="user-container">
<div class="user-guess">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>
</div>
<div class="feedback-container">
</div>
<div class="keyboard-container">
<div class="keyboard-row">
    <span>Q</span>
    <span>W</span>
    <span>E</span>
    <span>R</span>
    <span>T</span>
    <span>Y</span>
    <span>U</span>
    <span>I</span>
    <span>O</span>
    <span>P</span>
    <span class="key-button">Backspace</span>
</div>
<div class="keyboard-row">
    <span>A</span>
    <span>S</span>
    <span>D</span>
    <span>F</span>
    <span>G</span>
    <span>H</span>
    <span>J</span>
    <span>K</span>
    <span>L</span>
    <span class="key-button">Enter</span>
</div>
<div class="keyboard-row">
    <span>Z</span>
    <span>X</span>
    <span>C</span>
    <span>V</span>
    <span>B</span>
    <span>N</span>
    <span>M</span>
    <span class="key-button">New Game</span>
</div>
</div>
<div class="new-game-modal">
    <p>Start a new game?</p>
    <div class="modal-buttons">
        <button id="yes-btn">Yes</button>
        <button id="no-btn">No</button>
    </div>
</div>
</body>
</html>
